interface MutationResponse {
  code: String
  success: Boolean!
  message: String
}

type Response implements MutationResponse {
  code: String
  success: Boolean!
  message: String
}

type TransactionInfo {
  _id: ID!
  date: String
  category: String
  description: String
  amount: String
  transactionType: String
}

type MonthlyTotal {
  totalIncome: String!
  availableBalance: String!
  transactions: [TransactionInfo]!
}

type Query {
  getTransaction: [TransactionInfo]
  getTransactionByMonth(startDate: String!, endDate: String!): MonthlyTotal
}

type Mutation {
  addTransaction(date: String!, category: String!, description: String!, amount: String!, transactionType: String!): Response!
  updateTransaction(_id: ID!, date: String!, category: String!, description: String!, amount: String!, transactionType: String!): Response!
  deleteTransactionById(_id: ID!): Response!
}