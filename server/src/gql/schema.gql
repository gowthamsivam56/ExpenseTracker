interface MutationResponse {
  code: String
  success: Boolean!
  message: String
}

input InfoInput {
    firstName: String
    age: String
}

type Response implements MutationResponse {
    code: String
    success: Boolean!
    message: String
}

type user {
    firstName: String
    age: String
}

type Query {
    getUser: [user]
}

type Mutation {
    addUser(info: InfoInput!): Response!
}