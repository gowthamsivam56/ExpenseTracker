interface MutationResponse {
  code: String
  success: Boolean!
  message: String
}

type Response implements MutationResponse {
  code: String
  success: Boolean!
  message: String
}

type User {
  fullname: String
  email: String
  dbName: String
}

type LoginResponse implements MutationResponse {
  code: String
  success: Boolean!
  message: String
  token: String
  user: User
}

type TransactionInfo {
  _id: ID!
  date: String
  category: String
  description: String
  amount: Float
  transactionType: String
}

type MonthlyTotal {
  totalIncome: String!
  totalExpense: String!
  availableBalance: String!
  transactions: [TransactionInfo]!
}

type Query {
  getTransaction: [TransactionInfo]
  getTransactionByMonth(startDate: String!, endDate: String!): MonthlyTotal
}

type Mutation {
  signUp(fullname: String!, email: String!, password: String!): Response!
  logIn(email: String!, password: String!): LoginResponse!
  forgotPassword(email: String!): Response!
  resetPassword(userId: ID!, token: String!, password: String!): Response!
  addTransaction(date: String!, category: String!, description: String!, amount: Float!, transactionType: String!): Response!
  updateTransaction(_id: ID!, date: String!, category: String!, description: String!, amount: Float!, transactionType: String!): Response!
  deleteTransactionById(_id: ID!): Response!
}